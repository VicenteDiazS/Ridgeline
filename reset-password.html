<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset password · Ridgeline</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071019;color:#edf6fa;font:17px system-ui;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:440px;background:#112330;border:1px solid #2b4859;border-radius:24px;padding:28px}h1{font-size:29px}p{line-height:1.55;color:#bbced9}label{display:block;margin:18px 0}input,button{font:inherit;width:100%;padding:14px;border-radius:12px;margin-top:8px}input{background:#071019;color:white;border:1px solid #496171}button{background:#70e3ca;color:#06271f;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#70e3ca}#status{white-space:pre-wrap}[hidden]{display:none!important}</style></head>
<body><main><small>RIDGELINE · OWNER ACCOUNT</small><h1>Reset your password</h1>
<p id="intro">Request a reset email, then open its link to choose a new password.</p>
<form id="request"><label>Email<input id="email" type="email" autocomplete="username" required value="vicente.diaz.sal@gmail.com"></label><button>Send reset email</button></form>
<form id="change" hidden><label>New password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="8" required></label><button>Save new password</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="./index.html">Back to Ridgeline</a></p>
</main><script>
const endpoint="https://liogrqeevozzwefnketm.supabase.co/auth/v1/";
const publicKey="sb_publishable_LFaNldVgRH4iXHX3U0OVUg_nE1DiHfs";
const status=document.getElementById("status"),requestForm=document.getElementById("request"),changeForm=document.getElementById("change");
let recoveryToken="";
const fragment=new URLSearchParams(location.hash.slice(1));
if(fragment.has("access_token")||fragment.has("error")) history.replaceState(null,"",location.pathname);
if(fragment.get("error")) status.textContent=fragment.get("error_description")||"This reset link has expired. Request another email.";
if(fragment.get("type")==="recovery"&&fragment.get("access_token")){
  recoveryToken=fragment.get("access_token");
  requestForm.hidden=true;changeForm.hidden=false;
  document.getElementById("intro").textContent="Choose a new password with at least 8 characters.";
}
async function auth(path,body,token="",method="POST"){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{
  const headers={"apikey":publicKey,"Content-Type":"application/json"};
  if(token) headers.Authorization="Bearer "+token;
  const response=await fetch(endpoint+path,{method,headers,body:JSON.stringify(body),cache:"no-store",signal:controller.signal});
  const result=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(result.msg||result.error_description||result.message||"Request failed ("+response.status+").");
  return result;
 }catch(error){
  if(error.name==="TypeError"||error.name==="AbortError") throw new Error("Cannot reach the password service. Try switching between Wi-Fi and cellular, then try again. If it still fails, the Supabase project may need attention.");
  throw error;
 }finally{clearTimeout(timer);}
}
requestForm.addEventListener("submit",async event=>{
 event.preventDefault();const button=requestForm.querySelector("button");button.disabled=true;status.textContent="Requesting reset email…";
 try{
  const redirect=new URL("./reset-password.html",location.href).href;
  await auth("recover?redirect_to="+encodeURIComponent(redirect),{email:document.getElementById("email").value.trim()});
  status.textContent="If this email has an account, a reset link has been sent. Check your inbox and spam folder, then open the newest link.";
 }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
});
changeForm.addEventListener("submit",async event=>{
 event.preventDefault();
 const password=document.getElementById("password").value;
 if(password!==document.getElementById("confirm").value){status.textContent="The passwords do not match.";return;}
 if(!recoveryToken){status.textContent="Open the newest reset email first.";return;}
 const button=changeForm.querySelector("button");button.disabled=true;status.textContent="Saving your new password…";
 try{
  await auth("user",{password},recoveryToken,"PUT");
  recoveryToken="";changeForm.reset();changeForm.hidden=true;
  try{localStorage.removeItem("ridgeline-owner-auth-session-v1");}catch{}
  status.textContent="Password updated. Return to Ridgeline and sign in with your email and new password.";
 }catch(error){status.textContent=error.message;}finally{button.disabled=false;}
});
</script></body></html>
